<svg width="220" height="80" viewBox="0 0 220 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"></stop>
      <stop offset="50%" stop-color="#FFD93D"></stop>
      <stop offset="100%" stop-color="#6BCB77"></stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4D5BCE"></stop>
      <stop offset="100%" stop-color="#6BCB77"></stop>
    </linearGradient>
  </defs>

  <!-- Box with white T -->
  <rect x="0" y="0" width="60" height="60" rx="15" fill="url(#iconGrad)"></rect>
  <!-- White T inside box -->
  <line x1="30" y1="15" x2="30" y2="45" stroke="white" stroke-width="6" stroke-linecap="round"></line>
  <line x1="20" y1="15" x2="40" y2="15" stroke="white" stroke-width="6" stroke-linecap="round"></line>

  <!-- Text “ools” closer to the box -->
  <text x="62" y="42" font-family="Verdana, sans-serif" font-size="32" fill="url(#textGrad)" font-weight="bold">ools</text>
</svg>